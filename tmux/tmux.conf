
# allow mouse use
set -g mouse

# fast tmux config reload
bind r run-shell "tmux source-file ~/.config/tmux/tmux.conf && tmux display-message 'Config Reloaded.'"

# Add 256 color
set -g default-terminal "tmux-256color"

# Do not detach when you kill the active session
set -g detach-on-destroy off

# popup
bind y display-popup -E -T "Crab your dog after you pet" -h 60% -w 60% -d "#{pane_current_path}"

# cheat sheet
unbind t # t key is used to display the time
bind t display-popup -E -T "tmux" -h 70% -w 70% "curl -s https://raw.githubusercontent.com/donovanhubbard/cheat-sheet/refs/heads/main/tmux.md | less"
bind v display-popup -E -T "vim" -h 70% -w 70% "curl -s https://raw.githubusercontent.com/donovanhubbard/cheat-sheet/refs/heads/main/vim.md | less"

# create new session
bind u command-prompt -p "New session name" "new-session -s '%%'"

# kill a session
bind e command-prompt -p "Enter session to kill" "kill-session -t '%%'"

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# # vim-like pane resizing
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# Copy mode
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection # v to start copy selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy" # y to yank
bind P paste-buffer # captial P to paste
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy" # Copy with mouse

# # Apperance
set -g pane-border-indicators both
set -g pane-border-lines heavy
# TokyoNight colors for Tmux
set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status "on"
set -g status-justify "left"
#
set -g status-style "fg=#7aa2f7,bg=#16161e"
#
set -g status-left-length "100"
set -g status-right-length "100"
#
set -g status-left-style NONE
set -g status-right-style NONE
#
set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{prefix_highlight} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold]"

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
setw -g window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"

# Load plugins
run-shell "~/code/dotfiles/tmux/plugins/streamux/streamux.tmux"
